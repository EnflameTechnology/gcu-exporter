# GCU Exporter DaemonSet with HTTP Basic Auth (non-privileged, ARM).
#
# Before apply:
#   1. Replace REPLACE_WITH_BCRYPT_HASH in the Secret below.
#   2. Configure Prometheus scrape_configs basic_auth (username must match basic_auth_users key).
#   3. Use a gcu-exporter image that supports --web-config-file.
#
# Deploy:
#   kubectl apply -f gcu-exporter-for-arm-non-privileged-with-basic-auth.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: gcu-exporter-web-config
  namespace: kube-system
type: Opaque
stringData:
  web-config.yml: |
    basic_auth_users:
      prometheus: REPLACE_WITH_BCRYPT_HASH
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gcu-exporter-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: gcu-exporter-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: gcu-exporter-ds
    spec:
      hostNetwork: true
      containers:
        - name: gcu-exporter
          image: artifact.enflame.cn/enflame_docker_images/enflame/gcu-exporter:latest
          imagePullPolicy: IfNotPresent #Always
          args:
            - --web-config-file=/etc/gcu-exporter/web-config.yml
          env:
             - name: ENFLAME_VISIBLE_DEVICES
               value: all
          ports:
            - name: exporterport
              protocol: TCP
              containerPort: 9400
              hostPort: 9400
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 2000Mi
              cpu: 2000m
          volumeMounts:
            - name: web-config
              mountPath: /etc/gcu-exporter
              readOnly: true
            - name: syspath
              mountPath: /sys
            - name: localtime
              mountPath: /etc/localtime
            - name: varlock
              mountPath: /var/lock
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
            - name: libefml
              mountPath: /usr/lib/libefml-arm.so
            - name: efsmi
              mountPath: /usr/bin/efsmi
      volumes:
        - name: web-config
          secret:
            secretName: gcu-exporter-web-config # no-secret
        - name: syspath
          hostPath:
            path: /sys
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: varlock
          hostPath:
            path: /var/lock
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: libefml
          hostPath:
            path: /usr/lib/libefml-arm.so
            type: File
        - name: efsmi
          hostPath:
            path: /usr/bin/efsmi
            type: File
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gcu-exporter-ds
  name: gcu-exporter-service
  namespace: kube-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9400"
spec:
  selector:
    name: gcu-exporter-ds
  ports:
    - name: exporterport
      port: 9400
      targetPort: 9400
  type: NodePort
